[project]
name = "clinical-summary-verifier"
version = "0.1.0"
description = "Experimental verification of AI-generated discharge summaries against synthetic clinical records"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "markdown-it-py>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
